services:

  postgres:
    build:
      context: .
      dockerfile: ./Dockerfile_postgres
    container_name: postgres
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hr
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=ru_RU.UTF-8 --lc-ctype=ru_RU.UTF-8'

    ports:
      - 5432:5432

  memcached:
    image: memcached
    ports:
      - 11211:11211
    command:
      - -m 64